<!DOCTYPE html>
<html lang="id"></html>
<head>
    <meta charset="UTF-8">
    <title>Menu Navigasi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f8f9fa;
            color: #222;
            font-size: 1.25em;
            line-height: 1.7;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 24px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 18px 0;
        }
        a {
            display: inline-block;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 8px;
            font-size: 1.1em;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }
        a:focus, a:hover {
            background: #0056b3;
            color: #fff;
            text-decoration: underline;
        }
        a:active {
            background: #003d80;
        }
        @media (max-width: 600px) {
            body {
                margin: 10px;
                font-size: 1em;
            }
            a {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>Menu Navigasi</h1>
    <ul>
        <li><a href="/race" tabindex="1">Live</a></li>
        <li><a href="/display" tabindex="2">Log</a></li>
        <!-- Tambahkan file HTML lain di sini sesuai kebutuhan -->
    </ul>
</body>
</html>
