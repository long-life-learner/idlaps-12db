<!DOCTYPE html>
<html>
  <head>
    <title>Data Display</title>
    <script>
      function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("exTable");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
          const td = tr[i].getElementsByTagName("td")[0];
          if (td) {
            const textValue = td.textContent || td.innerText;
            tr[i].style.display =
              textValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
          }
        }
      }

      async function fetchData() {
        const response = await fetch("/data");
        let data = await response.json();
        const total_bib = data.total_bib;
        data = data.data;
        const tableBody = document.getElementById("data-body");
        tableBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${row.bib_number}</td><td>${row.timestamp}</td>`;
          tableBody.appendChild(tr);
        });
        const total_bib_el = document.getElementById("total_bib");
        total_bib_el.innerHTML = total_bib;
      }
      setInterval(fetchData, 5000);
      window.onload = fetchData;
    </script>
    <style>
      body {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
    </style>
  </head>
  <body style="margin: 0 auto; background-color: beige; text-align: center">
    <div style="position: sticky; top: 5px">
      <input
        type="button"
        value="Export"
        style="
          color: white;
          background-color: green;
          margin-bottom: 5px;
          min-height: 24px;
          padding: 10px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 16px;
        "
        onclick="exportToExcel('exTable')"
      />

      <input
        type="text"
        id="searchInput"
        style="
          min-height: 24px;
          font-size: 16px;
          padding: 5px;
          border-radius: 8px;
        "
        onkeyup="filterTable()"
        placeholder="Search by BIB number..."
      />
      <h4 style="display: inline; font-size: 20px" id="total_bib">0</h4>
      <a
        style="
          margin-bottom: 5px;
          min-height: 24px;
          padding: 10px;

          border-radius: 8px;
          cursor: pointer;
          list-style: none;
          display: inline;
          background-color: red;
          color: white;
          text-decoration: none;

          font-size: 16px;
        "
        href="/clear_data"
        onclick="return confirm('Anda yakin ingin dihapus ?')"
        >Clear All</a
      >
    </div>

    <table border="1" id="exTable" style="margin: 0 auto">
      <thead>
        <tr>
          <th>BIB</th>
          <th>Time</th>
        </tr>
      </thead>

      <tbody id="data-body"></tbody>
    </table>
    <script src="static/exportToExcel.js" defer></script>
  </body>
</html>
