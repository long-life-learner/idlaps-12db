<!DOCTYPE html>
<html>
  <head>
    <title>Data Display</title>
    <style>
      table {
        border-collapse: collapse;
        background-color: #ffffff;
        overflow: hidden;
        width: 500px;
        border-radius: 10px;
      }

      th,
      td {
        font-family: "Motnserrat", sans-serif;
        text-align: left;
        font-size: 24px;
        padding: 10px;
      }

      th {
        background-color: green;
        color: white;
        position: sticky;
      }
    </style>
    <script>
      let fetchInterval = null;
      let resumeTimeout = null;

      function startFetching() {
        if (!fetchInterval) {
          fetchInterval = setInterval(fetchData, 5000);
        }
      }

      function stopFetching() {
        if (fetchInterval) {
          clearInterval(fetchInterval);
          fetchInterval = null;
        }
      }

      function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("exTable");
        const tr = table.getElementsByTagName("tr");
        // Stop fetch saat user mengetik
        stopFetching();
        clearTimeout(resumeTimeout);
        for (let i = 1; i < tr.length; i++) {
          const td = tr[i].getElementsByTagName("td")[0];
          if (td) {
            const textValue = td.textContent || td.innerText;
            tr[i].style.display =
              textValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
          }
        }
        // Lanjutkan fetchData setelah 3 detik tidak mengetik
        resumeTimeout = setTimeout(() => {
          startFetching();
        }, 3000);
      }

      async function fetchData() {
        const response = await fetch("/data");
        let data = await response.json();
        const total_bib = data.total_bib;
        data = data.data;
        const tableBody = document.getElementById("data-body");
        tableBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${row.bib_number}</td><td>${row.timestamp}</td>`;
          tableBody.appendChild(tr);
        });
        const total_bib_el = document.getElementById("total_bib");
        total_bib_el.innerHTML = total_bib;
      }
      // Mulai fetch otomatis saat halaman dimuat
      window.onload = () => {
        fetchData();
        startFetching();
      };
    </script>
    <script>
      function clearData(endpoint, confirmMessage) {
        if (confirm(confirmMessage)) {
          fetch(endpoint)
            .then((response) => response.json())
            .then((data) => {
              if (data.message) {
                alert(data.message);
              } else if (data.error) {
                alert("Gagal menghapus data: " + data.error);
              }
              location.reload(); // refresh halaman setelah penghapusan
            })
            .catch((error) => {
              alert("Terjadi kesalahan: " + error);
            });
        }
        return false; // cegah default href
      }
    </script>

    <style>
      body {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
    </style>
  </head>
  <body
    style="
      margin: 0 auto;
      background-color: beige;
      text-align: center;
      padding: 10px;
    "
  >
    <a href="./">Upload Data EPC</a>
    <br />
    <br />
    <div style="position: sticky; top: 10px">
      <h4 style="display: inline; font-size: 20px" id="total_bib">0</h4>

      <input
        type="button"
        value="Export"
        style="
          color: white;
          background-color: green;
          margin-bottom: 5px;
          min-height: 24px;
          padding: 10px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 16px;
        "
        onclick="exportToExcel('exTable')"
      />

      <input
        type="text"
        id="searchInput"
        style="
          min-height: 24px;
          font-size: 16px;
          padding: 5px;
          border-radius: 8px;
        "
        onkeyup="filterTable()"
        placeholder="Search by BIB number..."
      />
      <a
        style="
          margin-bottom: 5px;
          min-height: 24px;
          padding: 10px;

          border-radius: 8px;
          cursor: pointer;
          list-style: none;
          display: inline;
          background-color: red;
          color: white;
          text-decoration: none;

          font-size: 16px;
        "
        href="#"
        onclick="return clearData('/clear_data', 'Anda yakin ingin hapus EPC dan Inventory?')"
        >Hapus EPC dan Inventory</a
      >
      <a
        style="
          margin-bottom: 5px;
          min-height: 24px;
          padding: 10px;

          border-radius: 8px;
          cursor: pointer;
          list-style: none;
          display: inline;
          background-color: red;
          color: white;
          text-decoration: none;

          font-size: 16px;
        "
        href="#"
        onclick="return clearData('/clear_inv', 'Anda yakin ingin hapus Inventory saja?')"
        >Hapus Inventory Saja</a
      >
    </div>

    <table border="3" id="exTable" style="margin: 0 auto">
      <thead>
        <tr>
          <th>BIB</th>
          <th>Waktu</th>
        </tr>
      </thead>

      <tbody id="data-body"></tbody>
    </table>
    <script src="static/exportToExcel.js" defer></script>
  </body>
</html>
