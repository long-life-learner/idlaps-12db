<!DOCTYPE html>
<html>
  <head>
    <title>Upload EPC</title>
    <style>
      .message {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      body {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
    </style>
  </head>
  <body
    style="
      margin: 0 auto;
      background-color: beige;
      text-align: center;
      padding: 10px;
    "
  >
    <h1>Upload Data EPC</h1>
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}
    <div class="message {{ category }}">{{ message }}</div>
    {% endfor %} {% endif %} {% endwith %}
    <form action="./upload" method="post" enctype="multipart/form-data">
      <input
        type="file"
        accept=".xls, .xlsx, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        name="file"
        required
      />
      <button type="submit">Upload</button>
    </form>
    <br />
    <br />
    <a
      href="./static/TEMPLATE_IMPORT.xlsx"
      style="
        text-decoration: none;
        color: white;
        background-color: green;
        margin-bottom: 5px;
        min-height: 24px;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      "
      >Unduh Template Disini</a
    >
    <a
      href="./display"
      style="
        text-decoration: none;
        color: white;
        background-color: green;
        margin-bottom: 5px;
        min-height: 24px;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      "
      >Lihat Data Yang Terbaca</a
    >
  </body>
</html>
