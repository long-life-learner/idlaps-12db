<head>
  <meta charset="UTF-8">

  <title>IDLAPS - 🏆 Live Standings</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Specific styles for Race page */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .timer-board {
      display: flex;
      gap: 2rem;
      justify-content: space-around;
      background: var(--surface-color);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
    }

    .timer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .timer-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .timer-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--primary-color);
      line-height: 1;
    }

    body.dark .timer-board {
      background: #1e293b;
      border-color: #334155;
    }

    body.dark .timer-value {
      color: #38bdf8;
    }

    /* Table Medals & Positions */
    .pos-1 {
      color: #fbbf24;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .pos-2 {
      color: #94a3b8;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .pos-3 {
      color: #b45309;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .bib-bubble {
      background: var(--text-primary);
      color: var(--surface-color);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1.1rem;
    }

    /* Row Animations */
    .row-move {
      transition: background-color 0.5s;
      background-color: #fef08a !important;
    }

    .row-up {
      animation: rowUp 0.7s;
    }

    .row-down {
      animation: rowDown 0.7s;
    }

    @keyframes rowUp {
      0% {
        background-color: #bbf7d0;
        transform: scale(1.01);
      }

      100% {
        background-color: inherit;
        transform: scale(1);
      }
    }

    @keyframes rowDown {
      0% {
        background-color: #fecaca;
      }

      100% {
        background-color: inherit;
      }
    }

    body.dark @keyframes rowUp {
      0% {
        background-color: #065f46;
      }

      100% {
        background-color: inherit;
      }
    }

    body.dark @keyframes rowDown {
      0% {
        background-color: #7f1d1d;
      }

      100% {
        background-color: inherit;
      }
    }

    /* Sidebar Off-canvas */
    .sidebar {
      height: 100vh;
      width: 0;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      background-color: var(--surface-color);
      box-shadow: var(--shadow-lg);
      overflow-x: hidden;
      transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: 2rem;
      border-right: 1px solid var(--border-color);
    }

    .sidebar-content {
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar .closebtn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Floating Panel Button */
    .floating-settings-btn {
      position: fixed;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 1rem 0.5rem;
      border-radius: 0 8px 8px 0;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 90;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
      font-weight: 500;
      transition: var(--transition);
    }

    .floating-settings-btn:hover {
      background: var(--primary-hover);
      padding-left: 1rem;
    }

    /* Checkbox Toggles inside sidebar */
    .toggle-list label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--text-primary);
    }
  </style>

    function updateColumnVisibility() {
      document.querySelectorAll("#raceTable th").forEach((th) => {
        const col = th.getAttribute("data-col");
        if (!col) return;
        th.style.display = visibleColumns.includes(col) ? "" : "none";
      });
      document.querySelectorAll("#raceTable tbody tr").forEach((tr) => {
        columnList.forEach((col, idx) => {
          const td = tr.children[idx];
          if (td) td.style.display = visibleColumns.includes(col.key) ? "" : "none";

      });
    }

    function parseTimeToDate(timeStr) {
      if (!timeStr) return null;
      const [hms, ms = "0"] = timeStr.split(".");
      const [h, m, s] = hms.split(":").map(Number);
      const date = new Date();
      date.setHours(h || 0, m || 0, s || 0, Number(ms.padEnd(3, "0")));
      return date;
    }

    function resetElapsedTimer() {
      if (elapsedInterval) clearInterval(elapsedInterval);
      const startTimeStr = raceStartTime || document.getElementById("sidebarStartTime").value;
      const now = new Date();
      let startDate = parseTimeToDate(startTimeStr);
      if (!startDate) { document.getElementById("elapsedTime").textContent = "00:00:00.000"; return; }
      startDate.setFullYear(now.getFullYear(), now.getMonth(), now.getDate());

      function updateElapsed() {
        const now = new Date();
        let diff = now - startDate;
        if (diff < 0) diff = 0;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const ms = diff % 1000;
        document.getElementById("elapsedTime").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
      }
      updateElapsed();
      elapsedInterval = setInterval(updateElapsed, 43); // ~24fps
    }

    resetElapsedTimer();
    updateLapToGo();
    setInterval(fetchRaceData, 3000);
  </script>
</body>
