<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Live Timing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        position: relative;
      }
      table {
        border-collapse: collapse;
        margin: auto;
        width: 90%;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #52df35;
        color: white;
      }
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      input,
      button {
        padding: 5px;
        margin: 5px;
      }
      .responsive-table {
        overflow-x: auto;
        width: 100%;
      }
      @media (max-width: 700px) {
        table {
          font-size: 12px;
        }
        th,
        td {
          padding: 4px;
        }
      }
      /* Sidebar styles */
      .sidebar {
        height: 100%;
        width: 0;
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        background-color: #222;
        overflow-x: hidden;
        transition: 0.3s;
        padding-top: 60px;
        color: #fff;
      }
      .sidebar-content {
        margin: 20px;
      }
      .sidebar .closebtn {
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 36px;
        color: #fff;
        background: none;
        border: none;
        cursor: pointer;
      }
      .openbtn {
        position: absolute;
        top: 10px;
        left: 5%;
        font-size: 12px;
        cursor: pointer;
        background-color: #52df35;
        color: white;
        border: none;
        padding: 5px 10px;
        margin-bottom: 10px;
        border-radius: 4px;
      }
      /* Animation for row swap */
      .row-move {
        transition: background-color 0.5s;
        background-color: #ffe066 !important;
      }
      body.dark {
        background: #181818;
        color: #e0e0e0;
      }
      body.dark table,
      body.dark th,
      body.dark td {
        background: #232323;
        color: #e0e0e0;
        border-color: #444;
      }
      body.dark th {
        background-color: #388e3c;
      }
      body.dark .sidebar {
        background: #181818;
        color: #e0e0e0;
      }
      .sidebar label {
        display: block;
        margin-bottom: 5px;
      }
      .theme-toggle {
        margin-top: 15px;
        margin-bottom: 10px;
      }
      /* MotoGP-style animation */
      .row-up {
        animation: rowUp 0.7s;
      }
      .row-down {
        animation: rowDown 0.7s;
      }
      @keyframes rowUp {
        0% {
          background-color: #b6ffb6;
        }
        100% {
          background-color: inherit;
        }
      }
      @keyframes rowDown {
        0% {
          background-color: #ffb6b6;
        }
        100% {
          background-color: inherit;
        }
      }

      .time-container {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        margin-left: 5%;
        margin-right: 5%;
      }
      #displayStartTime,
      #elapsedTime {
        font-weight: bold;
        color: #181818;
        font-size: 1.2em;
      }
    </style>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <button class="openbtn" onclick="openSidebar()">☰</button>
    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">
      <button class="closebtn" onclick="closeSidebar()">&times;</button>
      <div class="sidebar-content">
        <h2>Settings</h2>
        <label for="sidebarStartTime">Start Time:</label>
        <input type="time" id="sidebarStartTime" step="1" value="00:00:00" />
        <button onclick="setStartTimeFromSidebar()">Set</button>
        <hr />
        <div>
          <strong>Show/Hide Columns:</strong>
          <div id="columnToggles">
            <!-- Checkbox for each column, generated by JS -->
          </div>
        </div>
        <hr />
        <div class="theme-toggle">
          <label>
            <input type="checkbox" id="themeSwitch" />
            Dark Mode
          </label>
        </div>
        <hr />
        <button onclick="exportTableToExcel()">Export to Excel</button>
      </div>
    </div>

    <h1>Live Standings</h1>
    <div class="time-container">
      <!-- Display start time in main page -->
      <div>
        <span>🚦</span>
        <span id="displayStartTime">00:00:00</span>
      </div>
      <!-- Timer -->
      <div>
        <span>⏳</span>
        <span id="elapsedTime">00:00:00.000</span>
      </div>
    </div>

    <div class="responsive-table">
      <table id="raceTable">
        <thead>
          <tr>
            <th data-col="position">Pos</th>
            <th data-col="bib_number">BIB</th>
            <th data-col="name">Nama</th>
            <th data-col="team">Tim</th>
            <th data-col="lap_count">Lap</th>
            <th data-col="last_lap">Last Lap</th>
            <th data-col="total_time">Total Time</th>
            <th data-col="gap">Gap</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      let raceStartTime = null;
      let prevPositions = {};
      let prevOrder = {};
      let timerInterval = null;
      let elapsedInterval = null;
      const columnList = [
        { key: "position", label: "Pos" },
        { key: "bib_number", label: "BIB" },
        { key: "name", label: "Nama" },
        { key: "team", label: "Tim" },
        { key: "lap_count", label: "Lap" },
        { key: "last_lap", label: "Last Lap" },
        { key: "total_time", label: "Total Time" },
        { key: "gap", label: "Gap" },
      ];
      let visibleColumns =
        JSON.parse(localStorage.getItem("visibleColumns") || "null") ||
        columnList.map((c) => c.key);

      // Sidebar functions
      function openSidebar() {
        document.getElementById("mySidebar").style.width = "300px";
      }
      function closeSidebar() {
        document.getElementById("mySidebar").style.width = "0";
      }

      // Set start time from sidebar
      function setStartTimeFromSidebar() {
        const val = document.getElementById("sidebarStartTime").value;
        raceStartTime = val;
        document.getElementById("displayStartTime").textContent =
          val || "00:00:00";
        resetElapsedTimer();
      }

      // Export table to Excel
      function exportTableToExcel() {
        const table = document.getElementById("raceTable");
        const wb = XLSX.utils.table_to_book(table, { sheet: "Race" });
        XLSX.writeFile(wb, "race_standings.xlsx");
      }

      // Column visibility
      function renderColumnToggles() {
        const container = document.getElementById("columnToggles");
        container.innerHTML = "";
        columnList.forEach((col) => {
          const id = "toggle_" + col.key;
          const checked = visibleColumns.includes(col.key) ? "checked" : "";
          container.innerHTML += `<label><input type="checkbox" id="${id}" data-col="${col.key}" ${checked}> ${col.label}</label>`;
        });
        columnList.forEach((col) => {
          document
            .getElementById("toggle_" + col.key)
            .addEventListener("change", function () {
              if (this.checked) {
                if (!visibleColumns.includes(col.key))
                  visibleColumns.push(col.key);
              } else {
                visibleColumns = visibleColumns.filter((k) => k !== col.key);
              }
              localStorage.setItem(
                "visibleColumns",
                JSON.stringify(visibleColumns)
              );
              updateColumnVisibility();
            });
        });
      }
      function updateColumnVisibility() {
        // Header
        document.querySelectorAll("#raceTable th").forEach((th) => {
          const col = th.getAttribute("data-col");
          if (!col) return;
          th.style.display = visibleColumns.includes(col) ? "" : "none";
        });
        // Rows
        document.querySelectorAll("#raceTable tbody tr").forEach((tr) => {
          columnList.forEach((col, idx) => {
            const td = tr.children[idx];
            if (td)
              td.style.display = visibleColumns.includes(col.key) ? "" : "none";
          });
        });
      }

      // Theme toggle
      function setTheme(dark) {
        if (dark) {
          document.body.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.body.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      }
      document.addEventListener("DOMContentLoaded", function () {
        // Theme
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.getElementById("themeSwitch").checked = true;
          setTheme(true);
        }
        document
          .getElementById("themeSwitch")
          .addEventListener("change", function () {
            setTheme(this.checked);
          });
        // Column toggles
        renderColumnToggles();
        updateColumnVisibility();
      });

      // Fetch and animate table
      function fetchRaceData() {
        fetch(
          `/race_data?start_time=${encodeURIComponent(raceStartTime || "")}`
        )
          .then((res) => res.json())
          .then((json) => {
            const tbody = document.querySelector("#raceTable tbody");
            const newRows = [];
            json.data.forEach((row) => {
              newRows.push(row);
            });

            // Build a map of bib_number to row index for animation
            const newOrder = {};
            newRows.forEach((row, idx) => {
              newOrder[row.bib_number] = idx;
            });

            // Animate row movement (MotoGP style)
            Array.from(tbody.children).forEach((tr) => {
              const bib = tr.getAttribute("data-bib");
              if (
                bib &&
                prevOrder[bib] !== undefined &&
                prevOrder[bib] !== newOrder[bib]
              ) {
                if (prevOrder[bib] > newOrder[bib]) {
                  tr.classList.add("row-up");
                  setTimeout(() => tr.classList.remove("row-up"), 700);
                } else if (prevOrder[bib] < newOrder[bib]) {
                  tr.classList.add("row-down");
                  setTimeout(() => tr.classList.remove("row-down"), 700);
                }
              }
            });

            // Rebuild table body
            tbody.innerHTML = "";
            newRows.forEach((row) => {
              const tr = document.createElement("tr");
              tr.setAttribute("data-bib", row.bib_number);
              tr.innerHTML = `
                <td>${row.position}</td>
                <td>${row.bib_number}</td>
                <td>${row.name}</td>
                <td>${row.team}</td>
                <td>${row.lap_count}</td>
                <td>${row.last_lap}</td>
                <td>${row.total_time}</td>
                <td>${row.gap}</td>
              `;
              tbody.appendChild(tr);
            });

            // Update prevOrder for next animation
            prevOrder = {};
            newRows.forEach((row, idx) => {
              prevOrder[row.bib_number] = idx;
            });

            // Update column visibility after table update
            updateColumnVisibility();
          });
      }

      // Sync sidebar start time input with display
      document
        .getElementById("sidebarStartTime")
        .addEventListener("input", function () {
          document.getElementById("displayStartTime").textContent =
            this.value || "00:00:00";
          raceStartTime = this.value;
          resetElapsedTimer();
        });

      // Initial display
      document.getElementById("displayStartTime").textContent =
        document.getElementById("sidebarStartTime").value;

      // Timer logic
      function parseTimeToDate(timeStr) {
        // timeStr: "HH:mm:ss" or "HH:mm:ss.sss"
        if (!timeStr) return null;
        const [hms, ms = "0"] = timeStr.split(".");
        const [h, m, s] = hms.split(":").map(Number);
        const date = new Date();
        date.setHours(h || 0, m || 0, s || 0, Number(ms.padEnd(3, "0")));
        return date;
      }
      function resetElapsedTimer() {
        if (elapsedInterval) clearInterval(elapsedInterval);
        const startTimeStr =
          raceStartTime || document.getElementById("sidebarStartTime").value;
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        let startDate = parseTimeToDate(startTimeStr);
        if (!startDate) {
          document.getElementById("elapsedTime").textContent = "00:00:00.000";
          return;
        }
        // Set startDate to today
        startDate.setFullYear(now.getFullYear(), now.getMonth(), now.getDate());
        function updateElapsed() {
          const now = new Date();
          let diff = now - startDate;
          if (diff < 0) diff = 0;
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          const ms = diff % 1000;
          document.getElementById("elapsedTime").textContent = `${String(
            h
          ).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(
            s
          ).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
        }
        updateElapsed();
        elapsedInterval = setInterval(updateElapsed, 43); // ~24fps
      }
      resetElapsedTimer();

      setInterval(fetchRaceData, 3000);
    </script>
  </body>
</html>
