name: Build Verification

on:
  push:
    branches:
      - online
      - main
      - master
  pull_request:
    branches:
      - online
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: 🪟 Windows Build Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE (Online Mode)
        run: .\build_exe.bat online

      - name: Build EXE (Offline Mode)
        run: .\build_exe.bat offline

      - name: Check builds
        shell: bash
        run: |
          if [ ! -f "dist/IDLAPS-Online.exe" ]; then echo "Online EXE missing"; exit 1; fi
          if [ ! -f "dist/IDLAPS-Offline.exe" ]; then echo "Offline EXE missing"; exit 1; fi
          echo "All builds successful!"
