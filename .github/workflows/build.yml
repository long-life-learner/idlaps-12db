name: Build Verification

on:
  push:
    branches:
      - online
      - main
      - master
  pull_request:
    branches:
      - online
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: 🪟 Windows Build Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env.production
        shell: bash
        run: |
          echo "APP_NAME=IDLAPS Checkpoint" > .env.production
          echo "APP_MODE=online" >> .env.production
          echo "APP_ENV=production" >> .env.production
          echo "VERSION=dev" >> .env.production
          echo "IP_ADDRESS=192.168.1.200" >> .env.production
          echo "TCP_PORT=2022" >> .env.production
          echo "BAUD_RATE=115200" >> .env.production
          echo "IP_NETWORK=192.168.1.0" >> .env.production
          echo "CIDR=24" >> .env.production
          echo "FILENAME_LOG=el_uhf_rc.txt" >> .env.production
          echo "PORT=5000" >> .env.production

      - name: Build EXE (Online Mode)
        run: .\build_exe.bat online

      - name: Build EXE (Offline Mode)
        run: .\build_exe.bat offline

      - name: Check builds
        shell: bash
        run: |
          if [ ! -f "dist/IDLAPS-Online.exe" ]; then echo "Online EXE missing"; exit 1; fi
          if [ ! -f "dist/IDLAPS-Offline.exe" ]; then echo "Offline EXE missing"; exit 1; fi
          echo "All builds successful!"
